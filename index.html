<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArchVerse Judge Testing Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        gray: {
                            850: '#1f2937',
                            900: '#111827',
                            950: '#030712',
                        },
                        neon: {
                            blue: '#3b82f6',
                            purple: '#8b5cf6',
                            green: '#10b981',
                            red: '#ef4444',
                        }
                    },
                    boxShadow: {
                        'neon-purple': '0 0 15px rgba(139, 92, 246, 0.4)',
                        'neon-blue': '0 0 15px rgba(59, 130, 246, 0.4)',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #030712;
            color: #f3f4f6;
        }

        .input-dark {
            background-color: #1f2937;
            border: 1px solid #374151;
            color: #f9fafb;
            transition: all 0.2s;
        }

        .input-dark:focus {
            border-color: #8b5cf6;
            box-shadow: 0 0 10px rgba(139, 92, 246, 0.3);
            outline: none;
        }

        .glass-panel {
            background: rgba(31, 41, 55, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(55, 65, 81, 0.8);
        }

        /* Custom Scrollbar for Textareas and Logs */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #111827;
        }

        ::-webkit-scrollbar-thumb {
            background: #374151;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #4b5563;
        }

        .spinner {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body class="min-h-screen p-4 md:p-8">

    <div class="max-w-7xl mx-auto space-y-8">

        <!-- Header -->
        <header class="text-center py-6 border-b border-gray-800">
            <h1
                class="text-4xl md:text-5xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-neon-blue to-neon-purple tracking-tight mb-2">
                ArchVerse Testing Dashboard
            </h1>
            <p class="text-gray-400 font-mono text-sm tracking-widest uppercase">Utopia @ Graphic Era University</p>
        </header>

        <!-- Configuration Area -->
        <section class="glass-panel rounded-2xl p-6 shadow-xl">
            <div class="flex justify-between items-center mb-6 border-b border-gray-800 pb-4">
                <h2 class="text-xl font-semibold flex items-center gap-2">
                    <i class="fas fa-sliders h-5 w-5 text-neon-purple"></i> API Configuration
                </h2>
                <div class="flex items-center gap-2 text-sm">
                    <input type="checkbox" id="mockMode"
                        class="w-4 h-4 rounded bg-gray-800 border-gray-700 text-neon-purple focus:ring-neon-purple">
                    <label for="mockMode" class="text-gray-300 font-mono cursor-pointer">Force Simulation Mode</label>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                <!-- Endpoints -->
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-mono text-gray-400 mb-1">Problem Statement</label>
                        <select id="psSelect" class="w-full input-dark rounded-lg p-2.5 text-sm">
                            <option value="canteen">PS 1: Ravi Canteen Ordering</option>
                            <option value="seats">PS 2: Seminar Hall Seat Booking</option>
                            <option value="rides">PS 3: Weekend Exodus (Flash Ride-Sharing)</option>
                            <option value="coupons">PS 4: The Golden Ticket (Coupon Drop)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-mono text-gray-400 mb-1">Base URL (Leave empty for
                            mock)</label>
                        <input type="text" id="baseUrl" placeholder="http://localhost:3000"
                            class="w-full input-dark rounded-lg p-2.5 text-sm font-mono">
                    </div>
                    <div>
                        <label class="block text-xs font-mono text-gray-400 mb-1">View Endpoint Path (GET)</label>
                        <input type="text" id="viewPath" value="/api/view"
                            class="w-full input-dark rounded-lg p-2.5 text-sm font-mono">
                    </div>
                    <div>
                        <label class="block text-xs font-mono text-gray-400 mb-1">Reserve Endpoint Path (POST)</label>
                        <input type="text" id="reservePath" value="/api/reserve"
                            class="w-full input-dark rounded-lg p-2.5 text-sm font-mono">
                    </div>
                    <div>
                        <label class="block text-xs font-mono text-gray-400 mb-1">Status Update Path (PATCH)</label>
                        <input type="text" id="statusPath" value="/api/status"
                            class="w-full input-dark rounded-lg p-2.5 text-sm font-mono">
                    </div>
                </div>

                <!-- Payloads -->
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-mono text-gray-400 mb-1">Reserve JSON Payload <span
                                class="text-neon-purple text-xs">(Use {{USER_ID}})</span></label>
                        <textarea id="reservePayload" rows="3"
                            class="w-full input-dark rounded-lg p-2.5 text-sm font-mono">{"itemId": "item_1", "userId": "{{USER_ID}}"}</textarea>
                    </div>
                    <div>
                        <label class="block text-xs font-mono text-gray-400 mb-1">Out-of-Stock JSON Payload (For
                            Rejection Test)</label>
                        <textarea id="rejectionPayload" rows="2"
                            class="w-full input-dark rounded-lg p-2.5 text-sm font-mono">{"itemId": "invalid_or_empty_item", "userId": "test99"}</textarea>
                    </div>
                    <div>
                        <label class="block text-xs font-mono text-gray-400 mb-1">Invalid State JSON Payload (For Status
                            Test)</label>
                        <textarea id="statePayload" rows="2"
                            class="w-full input-dark rounded-lg p-2.5 text-sm font-mono">{"orderId": "123", "status": "FINAL_STATE"}</textarea>
                    </div>
                </div>
            </div>

            <div class="mt-8 flex justify-center">
                <button id="runTestsBtn"
                    class="bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-bold py-3 px-10 rounded-full shadow-neon-purple transform transition hover:scale-105 active:scale-95 flex items-center gap-3">
                    <i class="fas fa-play"></i> RUN AUTOMATED TESTS
                </button>
            </div>
        </section>

        <!-- Results Panel -->
        <section class="space-y-4" id="resultsContainer">
            <!-- Test Cards will be generated here -->
        </section>
    </div>

    <script>
        const testsConfig = [
            { id: 'test-1', title: '1. View Endpoint Load Test', desc: 'Fires 100 simultaneous GET requests. Expects 2xx responses.' },
            { id: 'test-2', title: '2. The Race (Concurrency)', desc: 'Fires 10 simultaneous POST requests with DIFFERENT user IDs. Expects exactly 1 success (2xx) and 9 rejects (4xx).' },
            { id: 'test-3', title: '3. Idempotency Check', desc: 'Fires 10 simultaneous POST requests with the SAME user ID. Expects safe handling (no 5xx crashes).' },
            { id: 'test-4', title: '4. Rejection Logic', desc: 'Fires 1 POST for an explicitly out-of-stock item. Expects clean 4xx rejection.' },
            { id: 'test-5', title: '5. State Machine Jump', desc: 'Fires 1 PATCH trying to jump to a final state directly. Expects 4xx rejection.' },
        ];

        // Initialize UI
        const resultsContainer = document.getElementById('resultsContainer');
        testsConfig.forEach(test => {
            resultsContainer.innerHTML += `
                <div id="${test.id}-card" class="glass-panel rounded-xl p-5 border-l-4 border-gray-600 transition-colors duration-300">
                    <div class="flex justify-between items-start mb-2">
                        <div>
                            <h3 class="text-lg font-bold text-gray-200">${test.title}</h3>
                            <p class="text-sm text-gray-400">${test.desc}</p>
                        </div>
                        <div id="${test.id}-status" class="flex items-center gap-2 font-mono text-sm font-bold text-gray-500 bg-gray-800 px-3 py-1 rounded-full">
                            <i class="fas fa-minus"></i> IDLE
                        </div>
                    </div>
                    <div class="mt-3 bg-gray-950 rounded-lg p-3 border border-gray-800">
                        <pre id="${test.id}-log" class="text-xs font-mono text-gray-400 h-20 overflow-y-auto whitespace-pre-wrap">Awaiting execution...</pre>
                    </div>
                </div>
            `;
        });

        const runBtn = document.getElementById('runTestsBtn');
        runBtn.addEventListener('click', runAllTests);

        // Helper to update UI
        function updateTestUI(id, status, logStr) {
            const card = document.getElementById(`${id}-card`);
            const statusBadge = document.getElementById(`${id}-status`);
            const logBox = document.getElementById(`${id}-log`);

            logBox.innerText += (logBox.innerText === 'Awaiting execution...' ? '' : '\n') + logStr;
            logBox.scrollTop = logBox.scrollHeight;

            statusBadge.className = 'flex items-center gap-2 font-mono text-sm font-bold px-3 py-1 rounded-full';
            card.className = 'glass-panel rounded-xl p-5 border-l-4 transition-colors duration-300';

            if (status === 'RUNNING') {
                statusBadge.classList.add('text-blue-400', 'bg-blue-900/30');
                statusBadge.innerHTML = `<i class="fas fa-circle-notch spinner"></i> RUNNING`;
                card.classList.add('border-blue-500');
            } else if (status === 'PASS') {
                statusBadge.classList.add('text-green-400', 'bg-green-900/30');
                statusBadge.innerHTML = `<i class="fas fa-check"></i> PASS`;
                card.classList.add('border-green-500');
            } else if (status === 'FAIL') {
                statusBadge.classList.add('text-red-400', 'bg-red-900/30');
                statusBadge.innerHTML = `<i class="fas fa-times"></i> FAIL`;
                card.classList.add('border-red-500');
            }
        }

        function resetUI() {
            testsConfig.forEach(test => {
                document.getElementById(`${test.id}-log`).innerText = '';
                updateTestUI(test.id, 'IDLE', 'Awaiting execution...');
            });
        }

        // Mock Fetch function to simulate API calls if no Base URL is provided
        async function smartFetch(url, options = {}) {
            const baseUrl = document.getElementById('baseUrl').value.trim();
            const forceMock = document.getElementById('mockMode').checked;

            if (!baseUrl || forceMock) {
                // SIMULATION LOGIC
                await new Promise(r => setTimeout(r, Math.random() * 200 + 50)); // Fake network delay

                let status = 200;

                // Simulate Test 2 (Race) - Only first mock request per item wins
                if (url.includes('reserve') && options.body) {
                    if (!window.mockInventory) window.mockInventory = 1;
                    if (options.body.includes('invalid_or_empty')) {
                        status = 400; // Out of stock
                    } else if (window.mockInventory > 0) {
                        window.mockInventory--;
                        status = 200;
                    } else {
                        status = 409; // Conflict/Out of stock
                    }
                }

                // Simulate Test 5 (Status)
                if (url.includes('status') && options.method === 'PATCH') {
                    status = 400; // Invalid state transition mock
                }

                return {
                    ok: status >= 200 && status < 300,
                    status: status,
                    text: async () => `{"mocked": true, "status": ${status}}`
                };
            } else {
                // REAL FETCH
                try {
                    return await fetch(url, options);
                } catch (e) {
                    return { ok: false, status: 0, text: async () => `Network Error: ${e.message}. Is CORS enabled?` };
                }
            }
        }

        async function runAllTests() {
            runBtn.disabled = true;
            runBtn.innerHTML = `<i class="fas fa-circle-notch spinner"></i> Running...`;
            resetUI();

            // Reset Mock state
            window.mockInventory = 1;

            const baseUrl = document.getElementById('baseUrl').value.trim();
            const isMock = !baseUrl || document.getElementById('mockMode').checked;

            const paths = {
                view: (isMock ? '' : baseUrl) + document.getElementById('viewPath').value,
                reserve: (isMock ? '' : baseUrl) + document.getElementById('reservePath').value,
                status: (isMock ? '' : baseUrl) + document.getElementById('statusPath').value,
            };

            const templates = {
                reserve: document.getElementById('reservePayload').value,
                reject: document.getElementById('rejectionPayload').value,
                state: document.getElementById('statePayload').value,
            };

            // TEST 1: VIEW LOAD
            updateTestUI('test-1', 'RUNNING', 'Initiating 100 concurrent GET requests...');
            let t1Pass = 0, t1Fail = 0;
            const t1Promises = Array.from({ length: 100 }, () => smartFetch(paths.view, { method: 'GET' }));
            const t1Results = await Promise.all(t1Promises);
            t1Results.forEach(r => r.ok ? t1Pass++ : t1Fail++);
            if (t1Pass > 90) {
                updateTestUI('test-1', 'PASS', `Success! ${t1Pass}/100 requests returned 2xx.`);
            } else {
                updateTestUI('test-1', 'FAIL', `Failed. ${t1Fail} errors. Server might have crashed.`);
            }

            // TEST 2: THE RACE
            updateTestUI('test-2', 'RUNNING', 'Initiating 10 concurrent POST requests with unique user IDs...');
            let t2Successes = 0, t2Rejects = 0, t2Errors = 0;
            const t2Promises = Array.from({ length: 10 }, (_, i) => {
                const payload = templates.reserve.replace('{{USER_ID}}', `race_user_${i}`);
                return smartFetch(paths.reserve, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: payload
                });
            });
            const t2Results = await Promise.all(t2Promises);
            t2Results.forEach(r => {
                if (r.status >= 200 && r.status < 300) t2Successes++;
                else if (r.status >= 400 && r.status < 500) t2Rejects++;
                else t2Errors++;
            });

            updateTestUI('test-2', 'RUNNING', `Results: ${t2Successes} Success, ${t2Rejects} Handled Rejects, ${t2Errors} Server Errors`);
            if (t2Successes === 1 && t2Rejects === 9 && t2Errors === 0) {
                updateTestUI('test-2', 'PASS', 'Perfect race condition handling! Exactly 1 allocated.');
            } else {
                updateTestUI('test-2', 'FAIL', 'Race condition detected. System allowed multiple claims or crashed.');
            }

            // TEST 3: IDEMPOTENCY
            updateTestUI('test-3', 'RUNNING', 'Initiating 10 concurrent POST requests with the SAME user ID...');
            window.mockInventory = 1; // Reset mock inventory just in case
            let t3Successes = 0, t3Rejects = 0, t3Crashes = 0;
            const t3Promises = Array.from({ length: 10 }, () => {
                const payload = templates.reserve.replace('{{USER_ID}}', `idem_user_99`);
                return smartFetch(paths.reserve, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: payload
                });
            });
            const t3Results = await Promise.all(t3Promises);
            t3Results.forEach(r => {
                if (r.status >= 200 && r.status < 300) t3Successes++;
                else if (r.status >= 400 && r.status < 500) t3Rejects++;
                else t3Crashes++;
            });

            updateTestUI('test-3', 'RUNNING', `Results: ${t3Successes} 2xx, ${t3Rejects} 4xx, ${t3Crashes} 5xx`);
            if (t3Crashes === 0) {
                updateTestUI('test-3', 'PASS', 'Idempotency handled safely. Server did not crash on rapid identical requests.');
            } else {
                updateTestUI('test-3', 'FAIL', 'Failed. Server threw 500 errors on rapid identical requests.');
            }

            // TEST 4: REJECTION LOGIC
            updateTestUI('test-4', 'RUNNING', 'Sending POST for explicitly out-of-stock item...');
            const t4Res = await smartFetch(paths.reserve, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: templates.reject
            });
            const t4Body = await t4Res.text();
            if (t4Res.status >= 400 && t4Res.status < 500) {
                updateTestUI('test-4', 'PASS', `Cleanly rejected with status ${t4Res.status}.\nResponse: ${t4Body}`);
            } else {
                updateTestUI('test-4', 'FAIL', `Expected 4xx, got ${t4Res.status}.\nResponse: ${t4Body}`);
            }

            // TEST 5: STATE MACHINE
            updateTestUI('test-5', 'RUNNING', 'Sending PATCH to skip to final state...');
            const t5Res = await smartFetch(paths.status, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: templates.state
            });
            const t5Body = await t5Res.text();
            if (t5Res.status >= 400 && t5Res.status < 500) {
                updateTestUI('test-5', 'PASS', `Invalid state jump rejected with status ${t5Res.status}.\nResponse: ${t5Body}`);
            } else {
                updateTestUI('test-5', 'FAIL', `Expected 4xx rejection, got ${t5Res.status}. State machine is bypassable.\nResponse: ${t5Body}`);
            }

            // Restore Button
            runBtn.disabled = false;
            runBtn.innerHTML = `<i class="fas fa-play"></i> RUN AUTOMATED TESTS`;
        }
    </script>
</body>

</html>
